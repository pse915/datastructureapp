<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DS Blackboard</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>/* ============================================================
 * DS BLACKBOARD — Pure Black SaaS Dashboard Theme
 * 스크린샷(Dark Theme SaaS 대시보드) 100% 반영 단일 글로벌 테마.
 * 원본: frontend/src/theme/black-dashboard.css
 * 배포: npm run build 시 Vite가 번들에 포함 (별도 복사 불필요)
 * 폰트: Pretendard(한글) + System UI 폴백. Apple Light / X.AI Obsidian
 * 변형은 .db-app[data-theme] 오버라이드로 전환 (리로드 없음).
 * ============================================================ */
.db-app {
  --db-bg: #0D0E12;
  --db-panel: #121318;
  --db-surface: #1A1C23;
  --db-surface-2: #1F2128;
  --db-border: #2D313E;
  --db-border-soft: #23262F;
  --db-accent: #0066FF;
  --db-accent-2: #00D1FF;
  --db-green: #00E676;
  --db-green-dim: rgba(0, 230, 118, 0.12);
  --db-blue-dim: rgba(0, 102, 255, 0.16);
  --db-text: #FFFFFF;
  --db-sub: #9EA5B5;
  --db-faint: #5B6272;
  --db-danger: #FF5C5C;
  --db-warn: #FFB020;
  --db-radius: 16px;
  --db-radius-sm: 12px;
  --db-font: 'Pretendard Variable', 'Pretendard', -apple-system,
    BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  --db-mono: 'JetBrains Mono', 'D2Coding', 'Consolas', monospace;
  min-height: 100vh;
  background: var(--db-bg);
  color: var(--db-text);
  font-family: var(--db-font);
  font-size: 15px;
  line-height: 1.6;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}
.db-app[data-font="system"] { --db-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
/* X.AI Obsidian 변형: 완전 카본 블랙 + 얇은 테두리 */
.db-app[data-theme="obsidian"] {
  --db-bg: #000000; --db-panel: #0A0A0B; --db-surface: #111113;
  --db-surface-2: #161618; --db-border: #26262A; --db-border-soft: #1C1C1F;
  --db-accent: #1D9BF0; --db-radius: 12px;
}
/* Apple Light 변형 */
.db-app[data-theme="apple-light"] {
  --db-bg: #F2F3F5; --db-panel: #FFFFFF; --db-surface: #FFFFFF;
  --db-surface-2: #F6F7F9; --db-border: #E2E4E9; --db-border-soft: #EDEEF1;
  --db-text: #111216; --db-sub: #6B7280; --db-faint: #A6ADBA;
  --db-blue-dim: rgba(0, 102, 255, 0.1); --db-green-dim: rgba(0, 180, 90, 0.1);
}
.db-app * { box-sizing: border-box; }
.db-app button { font-family: inherit; }
.db-app ::selection { background: rgba(0, 209, 255, 0.3); }
.db-shell { width: min(100% - 32px, 1180px); margin: 0 auto; padding: 18px 0 90px; display: grid; gap: 16px; }

/* ============ 상단 헤더 ============ */
.db-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13, 14, 18, 0.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--db-border-soft);
}
.db-app[data-theme="apple-light"] .db-header { background: rgba(255, 255, 255, 0.92); }
.db-header-in { width: min(100% - 32px, 1180px); margin: 0 auto; min-height: 68px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0; }
.db-brand { display: flex; align-items: center; gap: 11px; }
.db-brand-mark { width: 44px; height: 44px; border-radius: 14px; background: var(--db-surface-2); border: 1px solid var(--db-border); display: grid; place-items: center; font-size: 21px; }
.db-brand b { display: block; font-size: 16px; letter-spacing: -0.02em; }
.db-brand small { display: block; font-size: 11px; color: var(--db-sub); }
.db-year { font-size: 10px; font-weight: 800; color: var(--db-accent-2); background: var(--db-blue-dim); border-radius: 99px; padding: 3px 10px; margin-left: 6px; white-space: nowrap; }
.db-cat { display: flex; gap: 4px; background: var(--db-surface); border: 1px solid var(--db-border-soft); border-radius: 14px; padding: 4px; margin: 0 auto; }
.db-cat button { border: 0; background: transparent; color: var(--db-sub); font-size: 13.5px; font-weight: 800; border-radius: 10px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
.db-cat button.on { background: var(--db-surface-2); color: var(--db-text); box-shadow: inset 0 0 0 1px var(--db-border); }
.db-head-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.db-admin-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--db-surface); border: 1px solid var(--db-border-soft); color: var(--db-text); border-radius: 12px; padding: 9px 14px; font-size: 13px; font-weight: 800; cursor: pointer; }

/* ============ 버튼 ============ */
.db-btn { border: 1px solid var(--db-border); background: var(--db-surface); color: var(--db-text); border-radius: 11px; padding: 10px 16px; font-size: 13.5px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; justify-content: center; transition: transform 0.12s ease, filter 0.12s ease; text-decoration: none; }
.db-btn:hover { transform: translateY(-1px); filter: brightness(1.15); }
.db-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.db-btn-blue { background: var(--db-accent); border-color: var(--db-accent); color: #fff; box-shadow: 0 4px 18px rgba(0, 102, 255, 0.4); }
.db-btn-green { background: var(--db-green); border-color: var(--db-green); color: #03130a; box-shadow: 0 4px 18px rgba(0, 230, 118, 0.3); }
.db-btn-ghost { background: transparent; }
.db-btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }

/* ============ 서브 탭 (아이콘 가로 버튼) ============ */
.db-subtabs { display: flex; gap: 10px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
.db-subtab { flex: none; display: inline-flex; align-items: center; gap: 8px; background: var(--db-surface); border: 1px solid var(--db-border-soft); color: var(--db-sub); border-radius: 13px; padding: 11px 18px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.db-subtab .ico { font-size: 16px; }
.db-subtab small { font-size: 10px; font-weight: 800; background: var(--db-blue-dim); color: var(--db-accent-2); border-radius: 99px; padding: 1px 8px; }
.db-subtab.on { color: var(--db-text); border-color: var(--db-accent); box-shadow: 0 0 0 1px var(--db-accent), 0 4px 18px rgba(0, 102, 255, 0.25); }
.db-subtab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--db-faint); }
.db-subtab.done .dot { background: var(--db-green); box-shadow: 0 0 8px var(--db-green); }

/* ============ 필터 바 ============ */
.db-filterbar { display: flex; gap: 10px; align-items: center; background: var(--db-panel); border: 1px solid var(--db-border-soft); border-radius: var(--db-radius); padding: 14px 16px; flex-wrap: wrap; }
.db-seg { display: flex; gap: 4px; background: var(--db-surface); border-radius: 11px; padding: 4px; }
.db-seg button { border: 0; background: transparent; color: var(--db-sub); font-size: 12.5px; font-weight: 800; border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.db-seg button.on { background: var(--db-surface-2); color: var(--db-text); box-shadow: inset 0 0 0 1px var(--db-border); }
.db-search { margin-left: auto; background: var(--db-surface); border: 1px solid var(--db-border-soft); border-radius: 11px; padding: 9px 14px; color: var(--db-sub); font-size: 13px; display: flex; gap: 8px; align-items: center; min-width: 200px; }
.db-search input { border: 0; outline: 0; background: transparent; font: inherit; color: var(--db-text); width: 100%; }

/* ============ 범례 ============ */
.db-legend { display: flex; gap: 16px; align-items: center; font-size: 13px; color: var(--db-sub); flex-wrap: wrap; }
.db-legend b { color: var(--db-text); }
.db-legend .k { display: inline-flex; align-items: center; gap: 6px; }
.db-legend .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ============ 섹션 + 카드 그리드 ============ */
.db-section { background: var(--db-panel); border: 1px solid var(--db-border-soft); border-radius: var(--db-radius); padding: 22px; display: grid; gap: 16px; }
.db-section h2 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
.db-section .desc { margin: 0; color: var(--db-sub); font-size: 13.5px; }
.db-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.db-card { background: var(--db-surface); border: 1px solid var(--db-border-soft); border-radius: var(--db-radius); padding: 18px; display: grid; gap: 12px; cursor: pointer; transition: transform 0.14s ease, border-color 0.14s ease; text-align: left; color: var(--db-text); font: inherit; width: 100%; }
.db-card:hover { transform: translateY(-2px); border-color: var(--db-border); }
.db-card.sel { border-color: var(--db-accent); box-shadow: 0 0 0 1px var(--db-accent), 0 8px 30px rgba(0, 102, 255, 0.2); }
.db-card-head { display: flex; align-items: center; gap: 10px; }
.db-card-head .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--db-surface-2); border: 1px solid var(--db-border); display: grid; place-items: center; font-size: 20px; flex: none; }
.db-card-head b { font-size: 15.5px; display: block; }
.db-card-head small { font-size: 12px; color: var(--db-sub); }
.db-pill { margin-left: auto; font-size: 11px; font-weight: 800; background: var(--db-surface-2); border: 1px solid var(--db-border); color: var(--db-sub); border-radius: 99px; padding: 4px 12px; white-space: nowrap; flex: none; }
.db-pill.hot { color: var(--db-accent-2); border-color: var(--db-accent); }
.db-pill.done { color: var(--db-green); border-color: var(--db-green); }
/* 요일/단계 타일 5분할 */
.db-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.db-day { background: var(--db-panel); border: 1px solid var(--db-border-soft); border-radius: var(--db-radius-sm); padding: 10px 6px; display: grid; gap: 6px; justify-items: center; }
.db-day > span { font-size: 11px; font-weight: 800; color: var(--db-sub); }
.db-tile { width: 100%; font-size: 10.5px; font-weight: 700; text-align: center; background: var(--db-surface-2); border: 1px solid var(--db-border-soft); color: var(--db-sub); border-radius: 8px; padding: 5px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db-tile.hit { color: var(--db-accent-2); border-color: rgba(0, 209, 255, 0.4); }
.db-tile.good { color: var(--db-green); border-color: rgba(0, 230, 118, 0.4); }
.db-points { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.db-points li { font-size: 13px; color: var(--db-sub); background: var(--db-panel); border: 1px solid var(--db-border-soft); border-radius: 9px; padding: 7px 11px; }
.db-points li::before { content: '✓ '; color: var(--db-green); font-weight: 900; }

/* ============ 상세 패널 (개념+코드+실습+퀴즈) ============ */
.db-code { background: #0A0C10; border: 1px solid var(--db-border-soft); color: #E8EDF5; border-radius: var(--db-radius-sm); padding: 14px; font-family: var(--db-mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; margin: 0; white-space: pre; }
.db-app[data-theme="apple-light"] .db-code { background: #101418; }
.db-lab { border: 1px dashed var(--db-border); border-radius: var(--db-radius-sm); background: rgba(255, 255, 255, 0.015); padding: 14px; display: grid; gap: 10px; }
.db-lab-title { font-size: 11.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--db-sub); }
.db-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.db-viz { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; min-height: 60px; }
.db-node { min-width: 44px; height: 44px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--db-surface-2); border: 2px solid var(--db-border); border-radius: 12px; font-weight: 900; font-size: 15px; color: var(--db-text); animation: dbIn 0.25s ease; }
.db-node.top { border-color: var(--db-accent-2); box-shadow: 0 0 0 3px rgba(0, 209, 255, 0.15); }
.db-node.front { border-color: var(--db-accent); box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2); }
@keyframes dbIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.db-bars { display: flex; gap: 6px; align-items: flex-end; min-height: 110px; }
.db-bar { flex: 1; min-width: 22px; border-radius: 6px 6px 3px 3px; background: var(--db-accent); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; transition: height 0.2s ease; }
.db-bar.cmp { background: var(--db-warn); }
.db-bar.done { background: var(--db-green); }
.db-badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; background: var(--db-surface-2); border: 1px solid var(--db-border); color: var(--db-sub); border-radius: 99px; padding: 4px 12px; font-size: 11px; font-weight: 800; }
.db-badge.hot { color: var(--db-accent-2); border-color: var(--db-accent); }
.db-badge.good { color: var(--db-green); border-color: var(--db-green); }
.db-hint { color: var(--db-sub); font-size: 12.5px; }

/* ============ 입력/퀴즈/진행 ============ */
.db-input, .db-select, .db-textarea { border: 1px solid var(--db-border); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; width: 100%; background: var(--db-surface-2); color: var(--db-text); outline: 0; }
.db-input:focus, .db-select:focus, .db-textarea:focus { border-color: var(--db-accent); box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.25); }
.db-textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
.db-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.db-quiz-opt { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--db-border); background: var(--db-surface-2); border-radius: 12px; padding: 12px 14px; margin: 8px 0; font-size: 14px; color: var(--db-text); cursor: pointer; }
.db-quiz-opt:hover { border-color: var(--db-accent); }
.db-quiz-opt .letter { width: 28px; height: 28px; border-radius: 50%; background: var(--db-border); display: grid; place-items: center; font-size: 12px; font-weight: 900; flex: none; }
.db-quiz-opt.correct { border-color: var(--db-green); background: var(--db-green-dim); }
.db-quiz-opt.wrong { border-color: var(--db-danger); background: rgba(255, 92, 92, 0.1); }
.db-quiz-opt:disabled { cursor: default; }
.db-explain { background: var(--db-blue-dim); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--db-accent-2); }
.db-progress { height: 8px; background: var(--db-surface-2); border: 1px solid var(--db-border-soft); border-radius: 99px; overflow: hidden; }
.db-progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--db-accent), var(--db-accent-2)); border-radius: 99px; transition: width 0.3s ease; }
.db-mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 6px; }
.db-mem-card { min-height: 76px; border: 1px solid var(--db-border); border-radius: 12px; background: var(--db-surface-2); font: inherit; font-size: 22px; font-weight: 900; cursor: pointer; color: var(--db-faint); }
.db-mem-card.face { color: var(--db-text); }
.db-mem-card.matched { border-color: var(--db-green); color: var(--db-green); }
.db-frame { width: 100%; min-height: 420px; border: 1px solid var(--db-border); border-radius: 12px; background: #000; }
.db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.db-table th { font-size: 11px; color: var(--db-sub); padding: 10px 8px; border-bottom: 1px solid var(--db-border); white-space: nowrap; }
.db-table td { padding: 10px 8px; border-bottom: 1px solid var(--db-border-soft); text-align: center; }
.db-toast { border-radius: 12px; padding: 11px 14px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--db-border); background: var(--db-surface); }
.db-toast.success { border-color: var(--db-green); background: var(--db-green-dim); }
.db-toast.error { border-color: var(--db-danger); background: rgba(255, 92, 92, 0.1); }
.db-empty { padding: 26px; color: var(--db-sub); font-size: 13px; text-align: center; }
.db-like-pop { width: 84px; height: 84px; margin: 6px auto; border-radius: 50%; background: linear-gradient(135deg, var(--db-accent), var(--db-accent-2)); display: grid; place-items: center; color: #fff; font-size: 34px; animation: dbIn 0.4s ease; }

/* ============ 설정 모달 ============ */
.db-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 18px; }
.db-modal { width: min(100%, 560px); max-height: 88vh; overflow-y: auto; background: var(--db-surface); border: 1px solid var(--db-border); border-radius: 20px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); }
.db-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--db-border-soft); position: sticky; top: 0; background: var(--db-surface); }
.db-modal-head b { font-size: 17px; }
.db-modal-x { border: 0; background: transparent; color: var(--db-text); font-size: 22px; cursor: pointer; padding: 4px 10px; border-radius: 8px; }
.db-modal-body { padding: 20px 22px 26px; display: grid; gap: 18px; }
.db-modal-body h3 { margin: 0; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.db-modal-body h3 small { margin-left: auto; font-size: 11px; color: var(--db-faint); font-weight: 600; }
.db-theme-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.db-theme-opt { border: 1px solid var(--db-border); background: var(--db-surface-2); color: var(--db-sub); border-radius: 12px; padding: 12px 6px; font-size: 13px; font-weight: 800; cursor: pointer; }
.db-theme-opt.on { color: var(--db-text); border-color: var(--db-accent); box-shadow: 0 0 0 1px var(--db-accent); }
.db-dl { background: var(--db-surface-2); border: 1px solid var(--db-border-soft); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.db-dl p { margin: 0; font-size: 12.5px; color: var(--db-sub); }

/* ============ 로그인 ============ */
.db-auth-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; }
.db-hero h1 { font-size: 30px; line-height: 1.25; letter-spacing: -0.03em; margin: 10px 0; }
.db-hero h1 i { font-style: normal; color: var(--db-accent-2); }

/* ============ 반응형 ============ */
@media (max-width: 960px) { .db-grid { grid-template-columns: 1fr; } .db-auth-grid { grid-template-columns: 1fr; } .db-cat { order: 3; width: 100%; } }
@media (max-width: 640px) {
  .db-row { grid-template-columns: 1fr; }
  .db-days { grid-template-columns: repeat(5, minmax(88px, 1fr)); overflow-x: auto; }
  .db-search { min-width: 0; width: 100%; margin-left: 0; }
  .db-theme-row { grid-template-columns: 1fr; }
  .db-mem-grid { grid-template-columns: repeat(3, 1fr); }
  .db-head-actions .db-admin-pill span.nm { display: none; }
}

function bstInsert(root, v) {
  if (!root) return { v, l: null, r: null };
  if (v < root.v) return { ...root, l: bstInsert(root.l, v) };
  if (v > root.v) return { ...root, r: bstInsert(root.r, v) };
  return root;
}
function bstWalk(root, order = 'in', out = []) {
  if (!root) return out;
  if (order === 'pre') out.push(root.v);
  bstWalk(root.l, order, out);
  if (order === 'in') out.push(root.v);
  bstWalk(root.r, order, out);
  if (order === 'post') out.push(root.v);
  return out;
}
function bstLayout(root, x = 0, y = 0, dx = 90, nodes = [], edges = []) {
  if (!root) return { nodes, edges };
  nodes.push({ v: root.v, x, y });
  if (root.l) { edges.push([x, y, x - dx, y + 58]); bstLayout(root.l, x - dx, y + 58, dx * 0.6, nodes, edges); }
  if (root.r) { edges.push([x, y, x + dx, y + 58]); bstLayout(root.r, x + dx, y + 58, dx * 0.6, nodes, edges); }
  return { nodes, edges };
}

    const seen = []; const q = ['A']; const mark = new Set(['A']);
    if (mode === 'BFS') {
      while (q.length) { const cur = q.shift(); seen.push(cur); for (const nx of G_ADJ[cur]) if (!mark.has(nx)) { mark.add(nx); q.push(nx); } }
    } else {
      const st = ['A'];
      while (st.length) { const cur = st.pop(); if (seen.includes(cur)) continue; seen.push(cur); for (let i = G_ADJ[cur].length - 1; i >= 0; i--) { const nx = G_ADJ[cur][i]; if (!seen.includes(nx) && !st.includes(nx)) st.push(nx); } }
    }
    setVisited(seen);
  };
  return (
    <div>
      <div className="db-controls">
        <button className={`db-btn db-btn-sm ${mode === 'BFS' ? 'db-btn-grad' : ''}`} onClick={() => { setMode('BFS'); setVisited([]); }}>BFS (큐)</button>
        <button className={`db-btn db-btn-sm ${mode === 'DFS' ? 'db-btn-grad' : ''}`} onClick={() => { setMode('DFS'); setVisited([]); }}>DFS (스택)</button>
        <button className="db-btn db-btn-blue db-btn-sm" onClick={run}>탐색 실행</button>
        <button className="db-btn db-btn-sm" onClick={() => setVisited([])}>초기화</button>
      </div>
      <svg viewBox="0 0 260 155" style={{ width: '100%', background: '#fff', border: '1px solid #EFEFEF', borderRadius: 12 }}>
        {G_EDGES.map(([a, b], i) => <line key={i} x1={G_NODES[a][0]} y1={G_NODES[a][1]} x2={G_NODES[b][0]} y2={G_NODES[b][1]} stroke="#DBDBDB" strokeWidth="2.5" />)}
        {Object.entries(G_NODES).map(([k, [x, y]]) => {
          const idx = visited.indexOf(k);
          return (
            <g key={k}>
              <circle cx={x} cy={y} r="16" fill={idx >= 0 ? '#FDEFF4' : '#fff'} stroke={idx >= 0 ? '#cc2366' : '#8E8E8E'} strokeWidth="2.5" />
              <text x={x} y={y + 5} textAnchor="middle" fontSize="12" fontWeight="900" fill="#262626">{k}</text>
              {idx >= 0 && <text x={x + 20} y={y - 12} fontSize="10" fontWeight="800" fill="#cc2366">{idx + 1}</text>}
            </g>
          );
        })}
      </svg>
      <p className="db-hint">{mode} 순서: <b>{visited.join(' → ') || '실행 버튼을 눌러보세요'}</b></p>
    </div>
  );
}

function SortViz() {
  const [arr, setArr] = useState([38, 12, 51, 27, 64, 19]);
  const [cmp, setCmp] = useState([]);
  const [done, setDone] = useState([]);
  const [running, setRunning] = useState(false);
  const timers = useRef([]);
  const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; setRunning(false); };
  const shuffle = () => { stop(); setArr([...arr].sort(() => Math.random() - 0.5)); setCmp([]); setDone([]); };
  const bubble = () => {
    stop(); setRunning(true);
    const a = [...arr]; const steps = [];
    for (let i = 0; i < a.length; i++) for (let j = 0; j < a.length - 1 - i; j++) { steps.push([j, j + 1, [...a], false]); if (a[j] > a[j + 1]) { [a[j], a[j + 1]] = [a[j + 1], a[j]]; steps.push([j, j + 1, [...a], true]); } }
    steps.forEach(([x, y, snap, swapped], k) => {
      timers.current.push(setTimeout(() => {
        setArr(snap); setCmp([x, y]);
        if (k === steps.length - 1) { setDone(snap.map((_, i) => i)); setCmp([]); setRunning(false); }
      }, k * 320));
    });
  };
  const max = Math.max(...arr, 1);
  return (
    <div>
      <div className="db-controls">
        <button className="db-btn db-btn-blue db-btn-sm" disabled={running} onClick={bubble}>{running ? '정렬 중…' : '버블 정렬 실행'}</button>
        <button className="db-btn db-btn-sm" disabled={running} onClick={shuffle}>셔플</button>
      </div>
      <div className="db-bars">
        {arr.map((v, i) => (
          <div key={i} className={`db-bar ${done.includes(i) ? 'done' : cmp.includes(i) ? 'cmp' : ''}`} style={{ height: `${30 + (v / max) * 80}px` }}>{v}</div>
        ))}
      </div>
      <p className="db-hint">이웃 비교→교환을 반복. 평균 O(n²)</p>
    </div>
  );
}

function HashViz() {
  const [keys, setKeys] = useState(['apple', 'banana', 'grape']);
  const [val, setVal] = useState('');
  const buckets = useMemo(() => {
    const b = [[], [], [], [], []];
    keys.forEach((k) => { let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 5; b[h].push(k); });
    return b;
  }, [keys]);
  return (
    <div>
      <div className="db-controls">
        <input className="db-input" style={{ maxWidth: 160 }} value={val} onChange={(e) => setVal(e.target.value)} placeholder="키 입력" />
        <button className="db-btn db-btn-blue db-btn-sm" onClick={() => { if (val.trim()) { setKeys((s) => [...s, val.trim()]); setVal(''); } }}>삽입</button>
        <button className="db-btn db-btn-sm" onClick={() => setKeys(['apple', 'banana', 'grape'])}>리셋</button>
      </div>
      <div style={{ display: 'grid', gap: 6 }}>
        {buckets.map((b, i) => (
          <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <span className="db-badge">bucket {i}</span>
            {b.length === 0 && <span className="db-hint">— 비어 있음</span>}
            {b.map((k) => <span key={k} className="db-node" style={{ height: 36 }}>{k}</span>)}
            {b.length > 1 && <span className="db-badge-grad db-badge">충돌→체이닝</span>}
          </div>
        ))}
      </div>
      <p className="db-hint">h(key) = Σord(c) mod 5 · 평균 O(1)</p>
    </div>
  );
}

function ArrayViz() {
  const [arr, setArr] = useState([10, 20, 30, 40]);
  const [idx, setIdx] = useState('2');
  const [val, setVal] = useState('');
  const [msg, setMsg] = useState('arr[i] 접근 O(1) — 인덱스를 눌러보세요');
  const [hi, setHi] = useState(2);
  const read = (i) => { setHi(i); setMsg(`arr[${i}] = ${arr[i]} (O(1) 직접 접근)`); };
  const insert = () => {
    const i = Math.max(0, Math.min(arr.length, parseInt(idx, 10) || 0));
    const v = val.trim() === '' ? Math.floor(Math.random() * 90) + 10 : val.trim();
    setArr((s) => [...s.slice(0, i), v, ...s.slice(i)]); setMsg(`insert(${i}, ${v}) — 뒤 원소 밀기 O(n)`);
  };
  const remove = () => {
    const i = Math.max(0, Math.min(arr.length - 1, parseInt(idx, 10) || 0));
    if (!arr.length) return;
    setArr((s) => s.filter((_, k) => k !== i)); setMsg(`delete(${i}) — 뒤 원소 당기기 O(n)`);
  };
  return (
    <div>
      <div className="db-controls">
        <input className="db-input" style={{ maxWidth: 90 }} value={idx} onChange={(e) => setIdx(e.target.value)} placeholder="인덱스" inputMode="numeric" />
        <input className="db-input" style={{ maxWidth: 120 }} value={val} onChange={(e) => setVal(e.target.value)} placeholder="값(랜덤가능)" />
        <button className="db-btn db-btn-blue db-btn-sm" onClick={insert}>삽입</button>
        <button className="db-btn db-btn-sm" onClick={remove}>삭제</button>
        <button className="db-btn db-btn-sm" onClick={() => setArr([10, 20, 30, 40])}>리셋</button>
      </div>
      <div className="db-viz">
        {arr.map((v, i) => (
          <button key={`${i}-${v}`} className={`db-node ${i === hi ? 'top' : ''}`} style={{ flexDirection: 'column', height: 58 }} onClick={() => read(i)}>
            <span>{String(v)}</span><span style={{ fontSize: 10, color: '#8E8E8E' }}>[{i}]</span>
          </button>
        ))}
        {!arr.length && <div className="db-empty">빈 배열</div>}
      </div>
      <p className="db-hint">{msg}</p>
    </div>
  );
}

// 인스타 스타일 Quiz 문제 카드 + 결과 제출 (Vite 모듈 버전)

function QuizCard({ unit, solved, onSolve }) {
  const [picked, setPicked] = useState(null);
  const done = picked !== null;
  const correct = done && picked === unit.quiz.answer;
  const choose = (i) => {
    if (done) return;
    setPicked(i);
    if (i === unit.quiz.answer) onSolve?.(unit.id);
  };
  return (
    <div className="db-lab" style={{ borderStyle: 'solid' }}>
      <span className="db-lab-title">● MINI QUIZ — {solved ? '해결됨 ★' : '풀어보기'}</span>
      <div><b style={{ fontSize: 15 }}>{unit.quiz.q}</b></div>
      {unit.quiz.options.map((o, j) => {
        let cls = 'db-quiz-opt';
        if (done) { if (j === unit.quiz.answer) cls += ' correct'; else if (j === picked) cls += ' wrong'; }
        return (
          <button key={j} className={cls} disabled={done} onClick={() => choose(j)}>
            <span className="letter">{'ABCD'[j] || j + 1}</span>{o}
          </button>
        );
      })}
      {done && (
        <div className="db-explain">
          {correct ? '정답! 🎉 ' : '아쉬워요. 정답은 ' + 'ABCD'[unit.quiz.answer] + '번. '}{unit.quiz.explain}
        </div>
      )}
    </div>
  );
}

function makeEventId(p = 'event') {
  try { if (globalThis.crypto?.randomUUID) return `${p}-${globalThis.crypto.randomUUID()}`; } catch (_) {}
  return `${p}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}
function emit(action, payload = {}) {
  Streamlit.setComponentValue({ action, eventId: makeEventId(action), ...payload });
}
function downloadBlob(name, text, mime = 'text/html;charset=utf-8') {

}

/* ================= 미니게임 (기존 기능 유지) ================= */
const GAME_LABEL = { quiz: '4지선다 퀴즈', memory: '카드 맞추기', embed: '외부 게임' };
function gmUid(p = 'g') { return `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`; }
function gmShuffle(a) { const x = [...a]; for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[x[i], x[j]] = [x[j], x[i]]; } return x; }
function QuizPlayer({ config, onFinish }) {
  const qs = config.content?.questions || [];
  const [idx, setIdx] = useState(0); const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0); const [done, setDone] = useState(false);
  const [t0] = useState(Date.now()); const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  if (!qs.length) return <div className="db-empty">등록된 문제가 없습니다.</div>;
  if (done) return <div className="db-section"><div className="db-like-pop">♥</div><h2 style={{ textAlign: 'center' }}>{score}/{qs.length}점 저장 완료</h2></div>;
  const q = qs[idx];
  const choose = (i) => {
    if (picked !== null) return; setPicked(i);
    const ns = score + (i === q.answer ? 1 : 0); if (i === q.answer) setScore(ns);
    timers.current.push(setTimeout(() => {
      if (idx + 1 >= qs.length) { setDone(true); onFinish({ score: ns, maxScore: qs.length, durationSec: Math.round((Date.now() - t0) / 1000), detail: { correct: ns } }); }
      else { setIdx(idx + 1); setPicked(null); }
    }, 450));
  };
  return (
    <section className="db-section">
      <div className="db-progress"><i style={{ width: `${Math.round((idx / qs.length) * 100)}%` }} /></div>
      <h2 style={{ fontSize: 16 }}>{q.q}</h2>
      {(q.options || []).map((o, j) => {
        let cls = 'db-quiz-opt';
        if (picked !== null) { if (j === q.answer) cls += ' correct'; else if (j === picked) cls += ' wrong'; }
        return <button key={j} className={cls} onClick={() => choose(j)}><span className="letter">{'ABCD'[j] || j + 1}</span>{o}</button>;
      })}
    </section>
  );
}
function MemoryPlayer({ config, onFinish }) {
  const pairs = config.content?.pairs || [];
  const deck = useMemo(() => gmShuffle(pairs.flatMap((p, i) => [{ key: i, text: p.a }, { key: i, text: p.b }])), [config.updatedAt, pairs.length]);
  const [open, setOpen] = useState([]); const [matched, setMatched] = useState([]);
  const [moves, setMoves] = useState(0); const [lock, setLock] = useState(false);
  const [t0] = useState(Date.now()); const [done, setDone] = useState(false);
  const timers = useRef([]); useEffect(() => () => timers.current.forEach(clearTimeout), []);
  if (!pairs.length) return <div className="db-empty">등록된 카드가 없습니다.</div>;
  if (done) return <div className="db-section"><div className="db-like-pop">♥</div><h2 style={{ textAlign: 'center' }}>{pairs.length}쌍 완성 · 저장 완료</h2></div>;
  const flip = (i) => {
    if (lock || open.includes(i) || matched.includes(deck[i].key)) return;
    const no = [...open, i]; setOpen(no);
    if (no.length === 2) {
      setMoves(moves + 1);
      if (deck[no[0]].key === deck[no[1]].key) {
        const nm = [...matched, deck[no[0]].key]; setMatched(nm); setOpen([]);
        if (nm.length === pairs.length) { setDone(true); onFinish({ score: pairs.length, maxScore: pairs.length, durationSec: Math.round((Date.now() - t0) / 1000), detail: { moves: moves + 1 } }); }
      } else { setLock(true); timers.current.push(setTimeout(() => { setOpen([]); setLock(false); }, 650)); }
    }
  };
  return (
    <section className="db-section">
      <div className="db-progress"><i style={{ width: `${Math.round((matched.length / Math.max(1, pairs.length)) * 100)}%` }} /></div>
      <div className="db-mem-grid">{deck.map((c, i) => {
        const face = open.includes(i) || matched.includes(c.key);
        return <button key={i} className={`db-mem-card${face ? ' face' : ''}${matched.includes(c.key) ? ' matched' : ''}`} onClick={() => flip(i)}>{face ? c.text : '?'}</button>;
      })}</div>
    </section>
  );
}
function GamePlayer({ config, onFinish }) {
  if (config.type === 'memory') return <MemoryPlayer config={config} onFinish={onFinish} />;
  if (config.type === 'embed') {

}

        <div className="db-row" style={{ gridTemplateColumns: '1fr 1fr 1fr' }}>
          {[['등록 학생', dash.totalStudents], ['제출 학생', dash.submittedStudents], ['평균 점수', dash.averageScore]].map(([k, v]) => (
            <div key={k} className="db-lab" style={{ textAlign: 'center' }}><span className="db-hint">{k}</span><b style={{ fontSize: 24 }}>{v}</b></div>))}
        </div></section>

      <section className="db-section"><h2 style={{ fontSize: 15 }}>최근 제출</h2>

  const csvRows = (() => {

      const it = map.get(id); it[`${r.주차}주차`] = r.점수 || ''; it.총점 = (Number(it.총점) || 0) + (Number(r.점수) || 0);

      <main className="db-shell">
        {args.flash && <div className={`db-toast ${args.flash.type || ''}`}>{args.flash.text}</div>}

        {tab === 'dash' && <TeacherDash dash={dash} onStudent={(id) => { setSid(String(id)); setTab('eval'); }} />}

        {tab === 'ws' && (
          <section className="db-section"><div><h2>주차별 학습지 관리</h2><p className="desc">제목·안내·문제를 Sheets에 저장합니다.</p></div>

}

/* ---- 교사 게임/학습지 간이 어드민 (이벤트 규격은 기존과 동일) ---- */
function GameAdmin({ weeks, configs, records }) {
  const all = configs?.length ? configs : Array.from({ length: 17 }, (_, i) => ({ week: i + 1, enabled: false, type: 'quiz', title: `${i + 1}주차 미니게임`, desc: '', content: { questions: [] } }));
  const [week, setWeek] = useState(1); const [gtype, setGtype] = useState('quiz');
  const [title, setTitle] = useState(''); const [desc, setDesc] = useState('');
  const [qs, setQs] = useState([]); const [url, setUrl] = useState('');
  useEffect(() => {
    const c = all.find((x) => Number(x.week) === Number(week)) || {};
    setGtype(c.type || 'quiz'); setTitle(c.title || `${week}주차 미니게임`); setDesc(c.desc || '');
    setQs(((c.content || {}).questions || []).map((q) => ({ q: q.q || '', options: [...(q.options || ['', '', '', ''])], answer: q.answer || 0 })));
    setUrl((c.content || {}).url || '');
  }, [week]);
  const current = { week: Number(week), enabled: true, type: gtype, title, desc, content: gtype === 'quiz' ? { questions: qs } : { url: url.trim() } };
  return (
    <div style={{ display: 'grid', gap: 12 }}>
      <div className="db-subtabs">{all.map((c) => (
        <button key={c.week} className={`db-subtab${Number(week) === Number(c.week) ? ' on' : ''}`} onClick={() => setWeek(Number(c.week))}>
          <span className="dot" />{c.week}주차</button>))}</div>
      <div className="db-row">
        <select className="db-select" value={gtype} onChange={(e) => setGtype(e.target.value)}>
          <option value="quiz">4지선다 퀴즈</option><option value="memory">카드 맞추기</option><option value="embed">외부 게임</option>
        </select>
        <input className="db-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="게임 제목" />
      </div>
      <textarea className="db-textarea" style={{ minHeight: 70 }} value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="학생 안내문" />
      {gtype === 'quiz' && <>{qs.map((q, i) => (
        <div key={i} className="db-lab"><input className="db-input" value={q.q} onChange={(e) => { const c = [...qs]; c[i] = { ...c[i], q: e.target.value }; setQs(c); }} placeholder={`문제 ${i + 1}`} />
          {q.options.map((o, j) => <div key={j} style={{ display: 'grid', gridTemplateColumns: '24px 1fr', gap: 8, alignItems: 'center' }}>
            <input type="radio" checked={Number(q.answer) === j} onChange={() => { const c = [...qs]; c[i] = { ...c[i], answer: j }; setQs(c); }} />
            <input className="db-input" value={o} onChange={(e) => { const c = [...qs]; c[i] = { ...c[i], options: c[i].options.map((x, k) => (k === j ? e.target.value : x)) }; setQs(c); }} placeholder={`보기 ${'ABCD'[j]}`} />
          </div>})}</div>)}
        <button className="db-btn" onClick={() => setQs([...qs, { q: '', options: ['', '', '', ''], answer: 0 }])}>+ 문제 추가</button></>}
      {gtype === 'embed' && <input className="db-input" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://…" />}
      <div className="db-row">
        <button className="db-btn" onClick={() => emit('teacher_game_toggle', { week: Number(week), enabled: false })}>비공개</button>
        <button className="db-btn db-btn-blue" onClick={() => emit('teacher_game_save', { config: current })}>게임 저장</button>
      </div>
      <p className="db-hint">{week}주차 기록 {(records || []).filter((r) => Number(r.주차) === Number(week)).length}건</p>
    </div>
  );
}

      </div>
      <input className="db-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="학습지 제목" />

    </div>
  );
}

/* ================= 루트 ================= */
function App(props) {
  const args = { ...DEFAULT_ARGS, ...(props.args || {}) };
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('db-theme') || 'pure-black'; } catch (_) { return 'pure-black'; } });
  const [font, setFont] = useState('pretendard');
  useEffect(() => { try { localStorage.setItem('db-theme', theme); } catch (_) {} }, [theme]);
  useEffect(() => { Streamlit.setFrameHeight(2200); }, []);
  useEffect(() => {
    const t = setTimeout(() => {
      const h = Math.max(900, Math.ceil(document.getElementById('root')?.scrollHeight || 2200));
      Streamlit.setFrameHeight(h);
    }, 350);
    return () => clearTimeout(t);
  }, [args.role, theme]);
  const shared = { theme, setTheme, font, setFont };
  if (args.role === 'student') return <StudentApp args={args} {...shared} />;
  if (args.role === 'teacher') return <TeacherApp args={args} {...shared} />;
  return <Login flash={args.flash} />;
}


/* ===== Streamlit mount ===== */
function renderDsRoot() {
  var args = window.__streamlitArgs || {};
  var el = React.createElement(App, { args: args });
  var root = document.getElementById("root");
  try {
    if (ReactDOM.createRoot) {
      if (!window.__dsRoot) window.__dsRoot = ReactDOM.createRoot(root);
      window.__dsRoot.render(el);
    } else { ReactDOM.render(el, root); }
  } catch (e) { try { ReactDOM.render(el, root); } catch (e2) {} }
  try {
    var h = Math.max(900, Math.ceil((document.getElementById("root") || document.body).scrollHeight || 2400));
    Streamlit.setFrameHeight(h);
  } catch (e) {}
}
window.addEventListener("dsArgs", function() { try { renderDsRoot(); } catch (e) {} });
renderDsRoot();
setTimeout(function() { try { renderDsRoot(); } catch (e) {} }, 500);
